<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Barbershop Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #f0f2f5;
      font-family: "Segoe UI", Tahoma, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    #chat {
      flex: 1;
      width: 100%;
      max-width: 600px;
      padding: 15px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
    }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      margin: 6px 0;
      line-height: 1.5;
      word-wrap: break-word;
      font-size: 15px;
    }
    .bot {
      background: #fff;
      align-self: flex-start;
      border: 1px solid #ddd;
    }
    .user {
      background: #007bff;
      color: #fff;
      align-self: flex-end;
    }

    #inputArea {
      display: flex;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #ddd;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      max-width: 600px;
    }
    #inputArea input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 20px;
      margin-right: 10px;
      font-size: 16px;
    }
    #inputArea button {
      padding: 12px 18px;
      border: none;
      border-radius: 20px;
      background: #007bff;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    .pay-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 16px;
      background: #ffb347;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      color: #000;
      font-weight: bold;
      font-size: 15px;
    }

    .quick-questions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding-bottom: 60px; /* prevent overlap with input */
    }
    .quick-questions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 18px;
      background: #e4e6eb;
      cursor: pointer;
      font-size: 14px;
    }
    .quick-questions button:hover {
      background: #d8dadf;
    }
  </style>
</head>
<body>
  <div id="chat">
    <div class="msg bot">
      👋 Welcome to our Barbershop!  
      How can I help you today?
      <div class="quick-questions">
        <button onclick="quickAsk('What services do you offer?')">💈 Services</button>
        <button onclick="quickAsk('What dates are available?')">📅 Availability</button>
        <button onclick="quickAsk('I want to book a haircut')">✂️ Book now</button>
      </div>
    </div>
  </div>

  <div id="inputArea">
    <input id="userInput" placeholder="Type your message..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("userInput");

    // store short conversation history so backend can use it
    const conversation = [];

    function appendMessage(text, sender="bot") {
      const div = document.createElement("div");
      div.className = "msg " + sender;
      div.innerHTML = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;

      if (sender === "bot") {
        conversation.push({ role: "assistant", content: stripHTML(text) });
      }
      if (sender === "user") {
        conversation.push({ role: "user", content: text });
      }

      // keep conversation short (last 16 messages = 8 turns)
      while (conversation.length > 16) {
        conversation.shift();
      }
    }

    function stripHTML(html) {
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || "";
    }

    function quickAsk(question) {
      input.value = question;
      sendMessage();
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      input.value = "";

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            history: conversation
          })
        });
        const data = await res.json();
        appendMessage(data.reply, "bot");

        if (data.status === "reserved") {
          const payBtn = document.createElement("button");
          payBtn.innerText = "💳 Pay with Klarna";
          payBtn.className = "pay-btn";
          payBtn.onclick = () => payWithKlarna("Haircut", "Customer", 200);
          chat.appendChild(payBtn);
          chat.scrollTop = chat.scrollHeight;
        }
      } catch (err) {
        appendMessage("⚠️ Error: " + err.message, "bot");
      }
    }

    async function payWithKlarna(service, customer, amount) {
  try {
    const res = await fetch("/pay/klarna", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ service, customer_name: customer, amount })
    });
    const data = await res.json();

    if (data.redirect_url) {
      window.location.href = data.redirect_url;
    } else {
      appendMessage("⚠️ Klarna error: " + JSON.stringify(data), "bot");
    }
  } catch (err) {
    appendMessage("⚠️ Payment error: " + err.message, "bot");
  }
}

    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
