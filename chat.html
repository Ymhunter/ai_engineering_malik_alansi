<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Barbershop Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* Reset */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Chat container */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    /* Messages */
    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      margin: 6px 0;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .bot {
      background: #fff;
      align-self: flex-start;
      border: 1px solid #ddd;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .user {
      background: #007bff;
      color: white;
      align-self: flex-end;
    }

    /* Input area */
    #inputArea {
      display: flex;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #ddd;
      position: sticky;
      bottom: 0;
    }
    #inputArea input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 20px;
      margin-right: 10px;
      font-size: 16px;
    }
    #inputArea button {
      padding: 12px 18px;
      border: none;
      border-radius: 20px;
      background: #007bff;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    #inputArea button:hover {
      background: #0056b3;
    }

    /* Pay button */
    .pay-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 16px;
      background: #ffb347;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      color: #000;
      font-weight: bold;
      font-size: 15px;
    }
    .pay-btn:hover {
      background: #ffa500;
    }

    /* Quick start buttons */
    .quick-questions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .quick-questions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 18px;
      background: #e4e6eb;
      cursor: pointer;
      font-size: 14px;
    }
    .quick-questions button:hover {
      background: #d8dadf;
    }
  </style>
</head>
<body>
  <div id="chat">
    <div class="msg bot">
      👋 Welcome to our Barbershop!  
      I can help you book an appointment.  
      Please start by choosing one of the options below:
      <div class="quick-questions">
        <button onclick="quickAsk('What services do you offer?')">💈 Services</button>
        <button onclick="quickAsk('What dates are available?')">📅 Availability</button>
        <button onclick="quickAsk('I want to book a haircut')">✂️ Book now</button>
      </div>
    </div>
  </div>

  <div id="inputArea">
    <input id="userInput" placeholder="Type your message..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    const chat = document.getElementById("chat");

    function appendMessage(text, sender="bot") {
      const div = document.createElement("div");
      div.className = "msg " + sender;
      div.innerHTML = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // Handle quick start
    function quickAsk(question) {
      document.getElementById("userInput").value = question;
      sendMessage();
    }

    // Detect Klarna redirect success
    window.onload = () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get("payment") === "success") {
        const orderId = params.get("order_id") || "";
        appendMessage(`✅ Payment successful! Klarna Order ID: ${orderId}`, "bot");
      }
    };

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      input.value = "";

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        appendMessage(data.reply, "bot");

        if (data.status === "reserved") {
          const payBtn = document.createElement("button");
          payBtn.innerText = "💳 Pay with Klarna";
          payBtn.className = "pay-btn";
          payBtn.onclick = () => payWithKlarna("Haircut", "Customer", 200);
          chat.appendChild(payBtn);
          chat.scrollTop = chat.scrollHeight;
        }
      } catch (err) {
        appendMessage("⚠️ Error: " + err.message, "bot");
      }
    }

    async function payWithKlarna(service, customer, amount) {
      try {
        const res = await fetch("/pay/klarna", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ service, customer_name: customer, amount })
        });
        const data = await res.json();

        if (data.redirect_url) {
          window.location.href = data.redirect_url;
        } else {
          appendMessage("⚠️ Klarna error: " + JSON.stringify(data), "bot");
        }
      } catch (err) {
        appendMessage("⚠️ Payment error: " + err.message, "bot");
      }
    }
  </script>
</body>
</html>
