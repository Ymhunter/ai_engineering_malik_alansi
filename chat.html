<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Barbershop Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      max-width: 600px;
      margin: 0 auto;
      padding: 15px;
      width: 100%;
    }
    .msg {
      padding: 12px;
      margin: 6px;
      border-radius: 12px;
      line-height: 1.4em;
      word-wrap: break-word;
      font-size: 16px;
    }
    .user {
      background: #d1e7dd;
      text-align: right;
    }
    .bot {
      background: #ffffff;
      border: 1px solid #ddd;
    }
    #inputArea {
      display: flex;
      max-width: 600px;
      margin: 0 auto;
      padding: 8px;
      background: #fff;
      border-top: 1px solid #ddd;
      width: 100%;
    }
    #userInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-right: 8px;
      font-size: 16px;
    }
    #inputArea button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
    #inputArea button:hover {
      background: #0056b3;
    }
    .pay-btn {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 16px;
      background: #ffb347;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #000;
      font-weight: bold;
      font-size: 16px;
    }
    .pay-btn:hover {
      background: #ffa500;
    }
    .quick-btn {
      display: inline-block;
      margin: 6px 4px;
      padding: 8px 12px;
      background: #eee;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .quick-btn:hover {
      background: #ddd;
    }
  </style>
</head>
<body>
  <div id="chat">
    <div class="msg bot">👋 Hi! I’m your Barbershop Assistant. What’s your name?</div>
  </div>

  <div id="inputArea">
    <input id="userInput" placeholder="Type your answer..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    let customerName = "";
    let serviceType = "";
    let bookingStep = 1; // 1 = ask name, 2 = ask service, 3 = ask date/time, 4 = free chat

    function appendMessage(text, sender="bot") {
      const div = document.createElement("div");
      div.className = "msg " + sender;
      div.innerHTML = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // ✅ Quick reply button generator
    function addQuickReplies(options) {
      options.forEach(opt => {
        const btn = document.createElement("span");
        btn.className = "quick-btn";
        btn.innerText = opt;
        btn.onclick = () => {
          document.getElementById("userInput").value = opt;
          sendMessage();
        };
        chat.appendChild(btn);
      });
      chat.scrollTop = chat.scrollHeight;
    }

    window.onload = () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get("payment") === "success") {
        const orderId = params.get("order_id") || "";
        appendMessage(`✅ Payment successful! Klarna order ID: ${orderId}`, "bot");
      }
    };

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;
      appendMessage(text, "user");
      input.value = "";

      // --- Guided onboarding flow ---
      if (bookingStep === 1) {
        customerName = text;
        bookingStep = 2;
        appendMessage(`Nice to meet you, ${customerName}! Which service would you like?`);
        addQuickReplies(["💇 Haircut", "✂️ Beard Trim"]);
        return;
      }
      if (bookingStep === 2) {
        serviceType = text.replace("💇","").replace("✂️","").trim();
        bookingStep = 3;
        appendMessage(`Got it! You chose <b>${serviceType}</b>. Which date (YYYY-MM-DD) and time (HH:MM) works for you?`);
        return;
      }
      if (bookingStep === 3) {
        bookingStep = 4;
        appendMessage(`Perfect! Let me check availability for ${customerName}, ${serviceType}, on ${text}...`);
      }

      // --- Send to backend after onboarding ---
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            customer_name: customerName || null,
            service: serviceType || null
          })
        });
        const data = await res.json();
        appendMessage(data.reply, "bot");

        if (data.status === "reserved") {
          const payBtn = document.createElement("button");
          payBtn.innerText = "💳 Pay with Klarna";
          payBtn.className = "pay-btn";
          payBtn.onclick = () => payWithKlarna(serviceType || "Haircut", customerName || "Customer", 200);
          chat.appendChild(payBtn);
          chat.scrollTop = chat.scrollHeight;
        }
      } catch (err) {
        appendMessage("⚠️ Error: " + err.message, "bot");
      }
    }

    async function payWithKlarna(service, customer, amount) {
      try {
        const res = await fetch("/pay/klarna", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ service, customer_name: customer, amount })
        });
        const data = await res.json();

        if (data.redirect_url) {
          window.location.href = data.redirect_url;
        } else {
          appendMessage("⚠️ Klarna error: " + JSON.stringify(data), "bot");
        }
      } catch (err) {
        appendMessage("⚠️ Payment error: " + err.message, "bot");
      }
    }
  </script>
</body>
</html>
