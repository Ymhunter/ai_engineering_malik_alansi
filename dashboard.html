<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Barbershop Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f9f9f9;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      background: #007bff;
      color: #fff;
      width: 100%;
      padding: 15px;
      text-align: center;
      font-size: 1.2em;
      font-weight: bold;
    }
    section {
      width: 95%;
      max-width: 900px;
      background: #fff;
      margin: 15px;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background: #f1f1f1;
    }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    input, button, select {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      flex: 1;
    }
    button {
      background: #007bff;
      color: white;
      cursor: pointer;
      flex: 0 0 auto;
    }
    button:hover {
      background: #0056b3;
    }
    .status-pending { color: #ff9800; font-weight: bold; }
    .status-paid { color: #4caf50; font-weight: bold; }
    .status-cancelled { color: #f44336; font-weight: bold; }
    .status-processing { color: #2196f3; font-weight: bold; }
    #lastUpdated {
      text-align: right;
      font-size: 12px;
      color: #666;
    }
    @media (max-width: 600px) {
      table, th, td { font-size: 14px; }
      form { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>💈 Barbershop Dashboard</header>

  <!-- Slots Management -->
  <section>
    <h2>Available Slots</h2>
    <table id="slotsTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3>Add New Slot</h3>
    <form id="slotForm">
      <input type="date" id="slotDate" required />
      <input type="time" id="slotTime" required />
      <button type="submit">➕ Add Slot</button>
    </form>
  </section>

  <!-- Bookings -->
  <section>
    <h2>Bookings</h2>
    <table id="bookingsTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Service</th>
          <th>Date</th>
          <th>Time</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="lastUpdated"></p>
  </section>

  <script>
    async function loadSlots() {
      try {
        const res = await fetch("/api/slots");
        if (!res.ok) throw new Error("Failed to load slots");
        const slots = await res.json();
        const tbody = document.querySelector("#slotsTable tbody");
        tbody.innerHTML = "";
        for (const [date, times] of Object.entries(slots)) {
          times.forEach(time => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${date}</td>
              <td>${time}</td>
              <td><button onclick="deleteSlot('${date}','${time}')">❌ Delete</button></td>
            `;
            tbody.appendChild(tr);
          });
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function loadBookings() {
      try {
        const res = await fetch("/api/bookings");
        if (!res.ok) throw new Error("Failed to load bookings");
        const bookings = await res.json();
        const tbody = document.querySelector("#bookingsTable tbody");
        tbody.innerHTML = "";
        bookings.forEach(b => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${b.customer_name}</td>
            <td>${b.service}</td>
            <td>${b.date}</td>
            <td>${b.time}</td>
            <td class="status-${b.status}">${b.status}</td>
            <td>
              ${b.status !== "cancelled" ? `<button onclick="cancelBooking('${b.id}')">❌ Cancel</button>` : ""}
              ${b.status === "pending" ? `<button onclick="markPaid('${b.id}')">✅ Mark Paid</button>` : ""}
              ${b.status === "pending" ? `<button onclick="syncWithKlarna('${b.id}')">🔄 Sync</button>` : ""}
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById("slotForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const date = document.getElementById("slotDate").value;
      const time = document.getElementById("slotTime").value;
      await fetch("/api/slots", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ date, time })
      });
      loadSlots();
    });

    async function deleteSlot(date, time) {
      await fetch(`/api/slots?date=${date}&time=${time}`, { method: "DELETE" });
      loadSlots();
    }

    async function cancelBooking(id) {
      await fetch(`/api/bookings/${id}/cancel`, { method: "POST" });
      loadBookings();
    }

    async function markPaid(id) {
      await fetch(`/api/bookings/${id}/paid`, { method: "POST" });
      loadBookings();
    }

    async function syncWithKlarna(id) {
      try {
        const res = await fetch(`/api/bookings/${id}/sync`, { method: "POST" });
        const data = await res.json();
        alert(`Booking ${id} status: ${data.status}`);
        loadBookings();
      } catch (err) {
        console.error("Sync failed", err);
      }
    }

    function updateTimestamp() {
      document.getElementById("lastUpdated").innerText =
        "Last updated: " + new Date().toLocaleTimeString();
    }

    // auto-refresh every 10s
    setInterval(() => {
      loadSlots();
      loadBookings();
      updateTimestamp();
    }, 10000);

    loadSlots();
    loadBookings();
    updateTimestamp();
  </script>
</body>
</html>
