<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Barbershop Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f9f9f9;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      background: #007bff;
      color: #fff;
      width: 100%;
      padding: 15px;
      text-align: center;
      font-size: 1.3em;
      font-weight: bold;
    }
    section {
      width: 95%;
      max-width: 900px;
      background: #fff;
      margin: 15px;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background: #f1f1f1;
    }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    form input, form button {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    form input {
      flex: 1;
    }
    form button {
      background: #007bff;
      color: white;
      cursor: pointer;
      flex: 0 0 auto;
    }
    form button:hover {
      background: #0056b3;
    }
    .delete-btn {
      background: #dc3545;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .delete-btn:hover {
      background: #b02a37;
    }
    .status-pending { color: orange; font-weight: bold; }
    .status-paid { color: green; font-weight: bold; }
    .status-cancelled { color: red; font-weight: bold; }

    @media (max-width: 700px) {
      table, th, td {
        font-size: 14px;
      }
      form {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>💈 Barbershop Dashboard</header>

  <!-- Slots Management -->
  <section>
    <h2>Available Slots</h2>
    <table id="slotsTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3>Add New Slot</h3>
    <form id="slotForm">
      <input type="date" id="slotDate" required />
      <input type="time" id="slotTime" required />
      <button type="submit">➕ Add Slot</button>
    </form>
  </section>

  <!-- Bookings -->
  <section>
    <h2>Bookings</h2>
    <table id="bookingsTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Service</th>
          <th>Date</th>
          <th>Time</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script>
    async function loadSlots() {
      const res = await fetch("/api/slots");
      const slots = await res.json();
      const tbody = document.querySelector("#slotsTable tbody");
      tbody.innerHTML = "";
      for (const [date, times] of Object.entries(slots)) {
        times.forEach(time => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${date}</td>
            <td>${time}</td>
            <td><button class="delete-btn" onclick="deleteSlot('${date}','${time}')">❌ Delete</button></td>
          `;
          tbody.appendChild(tr);
        });
      }
    }

    async function loadBookings() {
      const res = await fetch("/api/bookings");
      const bookings = await res.json();
      const tbody = document.querySelector("#bookingsTable tbody");
      tbody.innerHTML = "";
      bookings.forEach(b => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${b.customer_name}</td>
          <td>${b.service}</td>
          <td>${b.date}</td>
          <td>${b.time}</td>
          <td class="status-${b.status}">${b.status}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById("slotForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const date = document.getElementById("slotDate").value;
      const time = document.getElementById("slotTime").value;
      await fetch("/api/slots", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ date, time })
      });
      loadSlots();
    });

    async function deleteSlot(date, time) {
      await fetch(`/api/slots?date=${date}&time=${time}`, { method: "DELETE" });
      loadSlots();
    }

    // initial load + auto refresh
    loadSlots();
    loadBookings();
    setInterval(loadBookings, 10000); // refresh bookings every 10s
  </script>
</body>
</html>
