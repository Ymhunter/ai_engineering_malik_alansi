<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Barbershop Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f9f9f9;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      background: #007bff;
      color: #fff;
      width: 100%;
      padding: 15px;
      text-align: center;
      font-size: 1.2em;
      font-weight: bold;
    }
    section {
      width: 95%;
      max-width: 1100px;
      background: #fff;
      margin: 15px;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h2 { margin-top: 0; color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th { background: #f1f1f1; }
    form {
      display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px;
    }
    input, button {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      flex: 1;
    }
    button {
      background: #007bff;
      color: white;
      cursor: pointer;
      flex: 0 0 auto;
    }
    button:hover { background: #0056b3; }
    .status-pending { color: #ff9800; font-weight: bold; }
    .status-paid { color: #4caf50; font-weight: bold; }
    .status-cancelled { color: #f44336; font-weight: bold; }
    .status-processing { color: #2196f3; font-weight: bold; }
    #lastUpdated { text-align: right; font-size: 12px; color: #666; }
    @media (max-width: 600px) {
      table, th, td { font-size: 13px; }
      form { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>💈 Barbershop Dashboard</header>

  <!-- Slots Management -->
  <section>
    <h2>Available Slots</h2>
    <table id="slotsTable">
      <thead>
        <tr><th>Date</th><th>Time</th><th>Action</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3>Add New Slot</h3>
    <form id="slotForm">
      <input type="date" id="slotDate" required />
      <input type="time" id="slotTime" required />
      <button type="submit">➕ Add Slot</button>
    </form>
  </section>

  <!-- Bookings -->
  <section>
    <h2>Bookings</h2>
    <table id="bookingsTable">
      <thead>
        <tr>
          <th>Name</th><th>Service</th><th>Date</th>
          <th>Time</th><th>Status</th><th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="lastUpdated"></p>
  </section>

<script>
  const slotsTable = document.querySelector("#slotsTable tbody");
  const bookingsTable = document.querySelector("#bookingsTable tbody");
  const lastUpdated = document.getElementById("lastUpdated");
  let pollInterval = null;

  // 🔹 Render slots
  function renderSlots(slots) {
    slotsTable.innerHTML = "";
    const sortedDates = Object.keys(slots).sort();
    sortedDates.forEach(date => {
      const times = slots[date].sort();
      times.forEach(time => {
        if (time.length === 8) time = time.slice(0, 5); // ✅ trim seconds
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${date}</td>
          <td>${time}</td>
          <td><button onclick="deleteSlot('${date}','${time}')">❌ Delete</button></td>
        `;
        slotsTable.appendChild(tr);
      });
    });
  }

  // 🔹 Render bookings
  function renderBookings(bookings) {
    bookingsTable.innerHTML = "";
    bookings.forEach(b => {
      let time = b.time;
      if (time.length === 8) time = time.slice(0, 5);
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${b.customer_name}</td>
        <td>${b.service}</td>
        <td>${b.date}</td>
        <td>${time}</td>
        <td class="status-${b.status}">${b.status}</td>
        <td>
          ${b.status !== "cancelled" ? `<button onclick="cancelBooking('${b.id}')">❌ Cancel</button>` : ""}
          ${b.status === "pending" ? `<button onclick="markPaid('${b.id}')">✅ Mark Paid</button>` : ""}
        </td>
      `;
      bookingsTable.appendChild(tr);
    });
  }

  // 🔹 Add slot
  document.getElementById("slotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const date = document.getElementById("slotDate").value;
    let time = document.getElementById("slotTime").value;
    if (time.length === 8) time = time.slice(0, 5); // ✅ trim seconds

    try {
      const res = await fetch("/api/slots", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ date, time })
      });
      if (!res.ok) {
        const err = await res.text();
        console.error("Add slot failed", err);
        alert("⚠️ Could not add slot: " + err);
      }
    } catch (err) {
      console.error("Add slot error", err);
      alert("⚠️ Network error when adding slot");
    }
  });

  // 🔹 Slot + Booking actions
  async function deleteSlot(date, time) {
    if (time.length === 8) time = time.slice(0, 5);
    await fetch(`/api/slots?date=${date}&time=${time}`, { method: "DELETE" });
  }
  async function cancelBooking(id) {
    await fetch(`/api/bookings/${id}/cancel`, { method: "POST" });
  }
  async function markPaid(id) {
    await fetch(`/api/bookings/${id}/paid`, { method: "POST" });
  }

  // 🔹 Timestamp
  function updateTimestamp() {
    lastUpdated.innerText = "Last updated: " + new Date().toLocaleTimeString();
  }

  // 🔹 Initial load (also used for polling fallback)
  async function initialLoad() {
    try {
      const slotsRes = await fetch("/api/slots?ts=" + Date.now(), { cache: "no-store" });
      renderSlots(await slotsRes.json());

      const bookingsRes = await fetch("/api/bookings?ts=" + Date.now(), { cache: "no-store" });
      renderBookings(await bookingsRes.json());

      updateTimestamp();
    } catch (err) {
      console.error("Failed to load data", err);
    }
  }

  // 🔹 WebSocket connection
  const protocol = window.location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${protocol}://${window.location.host}/ws/dashboard`);

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.slots) renderSlots(data.slots);
    if (data.bookings) renderBookings(data.bookings);
    updateTimestamp();
  };

  ws.onopen = () => {
    console.log("✅ Connected to live updates");
    if (pollInterval) {
      clearInterval(pollInterval);
      pollInterval = null;
    }
  };

  ws.onclose = () => {
    console.log("❌ Disconnected from live updates, switching to polling");
    if (!pollInterval) {
      pollInterval = setInterval(initialLoad, 15000);
    }
  };

  // 🔹 Load immediately
  initialLoad();
</script>
</body>
</html>
