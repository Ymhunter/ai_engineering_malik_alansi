<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Barbershop Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      padding: 10px;
      margin: 6px 0;
      border-radius: 10px;
      line-height: 1.4em;
      max-width: 85%;
      word-wrap: break-word;
    }
    .user {
      background: #d1e7dd;
      align-self: flex-end;
      margin-left: auto;
    }
    .bot {
      background: #ffffff;
      border: 1px solid #ddd;
      align-self: flex-start;
      margin-right: auto;
    }
    #inputArea {
      display: flex;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #ddd;
      position: sticky;
      bottom: 0;
    }
    #inputArea input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 20px;
      margin-right: 10px;
    }
    #inputArea button {
      padding: 12px 18px;
      border: none;
      border-radius: 20px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    #inputArea button:hover {
      background: #0056b3;
    }
    .pay-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 16px;
      background: #ffb347;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #000;
      font-weight: bold;
    }
    .pay-btn:hover {
      background: #ffa500;
    }
  </style>
</head>
<body>
  <div id="chat"></div>

  <div id="inputArea">
    <input id="userInput" placeholder="Type your message..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    const chat = document.getElementById("chat");

    function appendMessage(text, sender="bot"){
      const div = document.createElement("div");
      div.className = "msg " + sender;
      div.innerHTML = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // Onboarding questions
    const questions = [
      "👋 Hi! I’m your Barbershop Assistant. What’s your name?",
      "Great! What service would you like (e.g., Haircut)?",
      "When would you like to book? Please provide date (YYYY-MM-DD) and time (HH:MM)."
    ];
    let questionIndex = 0;
    let userInfo = {};

    function askNextQuestion() {
      if (questionIndex < questions.length) {
        appendMessage(questions[questionIndex], "bot");
      }
    }

    askNextQuestion();

    async function sendMessage(){
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;
      appendMessage(text, "user");
      input.value = "";

      // Handle onboarding
      if (questionIndex === 0) {
        userInfo.name = text;
        questionIndex++;
        askNextQuestion();
        return;
      }
      if (questionIndex === 1) {
        userInfo.service = text;
        questionIndex++;
        askNextQuestion();
        return;
      }
      if (questionIndex === 2) {
        userInfo.dateTime = text;
        questionIndex++;
        appendMessage("Thanks! Let me check availability for you…", "bot");
        // Send to backend
      }

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        appendMessage(data.reply, "bot");

        if (data.status === "reserved"){
          const payBtn = document.createElement("button");
          payBtn.innerText = "💳 Pay with Klarna";
          payBtn.className = "pay-btn";
          payBtn.onclick = () => payWithKlarna(userInfo.service || "Haircut", userInfo.name || "Customer", 200);
          chat.appendChild(payBtn);
          chat.scrollTop = chat.scrollHeight;
        }
      } catch (err) {
        appendMessage("⚠️ Error: " + err.message, "bot");
      }
    }

    async function payWithKlarna(service, customer, amount){
      try {
        const res = await fetch("/pay/klarna", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ service, customer_name: customer, amount })
        });
        const data = await res.json();

        if (data.redirect_url){
          window.location.href = data.redirect_url;
        } else {
          appendMessage("⚠️ Klarna error: " + JSON.stringify(data), "bot");
        }
      } catch (err) {
        appendMessage("⚠️ Payment error: " + err.message, "bot");
      }
    }
  </script>
</body>
</html>
